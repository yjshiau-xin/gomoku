<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋</title>
<style>
/* 固定用深色底 */
:root {
  --bg: #0C182B;
  --card: #15253D;
  --ink: #E3EAF4;
  --muted: #97A8BF;
  --line: #2C4060;
  --accent: #C8A44D;
  --wood: #CFA65E;
  --wood-edge: #9E7535;
  --grid: #2E200A;
  --focus: #6FB0FF;
  --shadow: 0 2px 12px rgba(0, 0, 0, .45);
  --lv0: #2E7D4F;
  --lv1: #2F6DB0;
  --lv2: #AD5A14;
  --lv3: #B8322A;
  --danger: #8E2626;
  --danger-hover: #4F1212;
  --orange: #A84B16;
  --orange-hover: #6A2B08;
  --brass: #8A6516;
  --brass-hover: #5C430D;
  --good: #4CAF73;
  --q: #D9B83A;
  --miss: #E8873A;
  --bad: #E0564C;
  --me: #4CAF73;
  --cpu: #4A5B75;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
.app { max-width: 1100px; margin: 0 auto; padding: 20px 24px 32px; }

/* 標題列 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 {
  margin: 0;
  font-family: "Songti TC", "STSong", serif;
  font-size: 34px;
  color: var(--accent);
  white-space: nowrap;
}
.ver { font-family: "PingFang TC", sans-serif; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.tools { display: flex; gap: 8px; }
.tool {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.tool:hover { border-color: var(--ink); background: rgba(127, 140, 160, .15); }

/* 版面 */
.layout { display: flex; gap: 24px; align-items: flex-start; }
.board-wrap { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
.side { flex: 0 0 360px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.panel { display: flex; flex-direction: column; gap: 14px; }

/* 棋盤 */
.board {
  width: max(420px, min(calc(100vh - 110px), 640px));
  max-width: 100%;
  padding: 2.2%;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(255, 255, 255, .18), rgba(0, 0, 0, .06)), var(--wood);
  box-shadow: inset 0 0 0 2px var(--wood-edge), var(--shadow);
}
.inner { position: relative; width: 100%; aspect-ratio: 1; }
.grid { position: absolute; inset: 0; width: 100%; height: 100%; }
.grid line { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grid line.edge { stroke-width: 2; }
.grid circle { fill: var(--grid); }
.cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  grid-template-rows: repeat(15, 1fr);
}
.cell { position: relative; display: flex; align-items: center; justify-content: center; outline: none; }
.board.myturn .cell:not(.has) { cursor: pointer; }
.cell:focus-visible::after {
  content: "";
  position: absolute;
  inset: 4%;
  border: 2px solid var(--focus);
  border-radius: 50%;
}
.stone { position: relative; width: 88%; height: 88%; border-radius: 50%; box-shadow: 1px 2px 3px rgba(0, 0, 0, .45); }
.stone.black { background: radial-gradient(circle at 34% 30%, #6B6B6B 0, #222 45%, #050505 100%); }
.stone.white { background: radial-gradient(circle at 34% 30%, #FFF 0, #EEE 40%, #C6C6C6 100%); }
.stone.drop { animation: drop .18s ease-out; }
@keyframes drop { from { transform: scale(1.3); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.cell.last .stone::after {
  content: "";
  position: absolute;
  left: 37%;
  top: 37%;
  width: 26%;
  height: 26%;
  border-radius: 50%;
  background: #E0362C;
}
.cell.win .stone { box-shadow: 0 0 0 3px #F2C230, 0 0 10px 3px rgba(242, 194, 48, .85); }
.board[data-me="1"] { --ghost: #111; }
.board[data-me="2"] { --ghost: #FFF; }
.board.myturn .cell.pending::before,
.board.myturn .cell:not(.has):hover::before {
  content: "";
  width: 80%;
  height: 80%;
  border-radius: 50%;
  background: var(--ghost);
  opacity: .45;
}
.board.myturn .cell.pending::before { opacity: .7; box-shadow: 0 0 0 2px var(--focus); }
@media (hover: none) {
  .board.myturn .cell:not(.has):not(.pending):hover::before { content: none; }
}
/* 棋盤上的圈：建議、危險、覆盤的好位置 */
.mark { position: absolute; inset: 6%; border-radius: 50%; pointer-events: none; z-index: 2; }
.cell.m-hint .mark, .cell.m-best .mark { border: 3px solid #1FA65A; background: rgba(31, 166, 90, .18); }
.cell.m-hint .mark { animation: pulse .9s ease-in-out infinite alternate; }
.cell.m-d5 .mark { border: 3px solid #E0362C; background: rgba(224, 54, 44, .15); }
.cell.m-d3 .mark { border: 3px dashed #E07E1A; }
@keyframes pulse { from { transform: scale(.85); } to { transform: scale(1.05); } }

/* 右側面板 */
.card { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.status { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 20px; font-weight: 700; }
.mini { flex: none; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.mini.black { background: radial-gradient(circle at 34% 30%, #6B6B6B 0, #050505 90%); }
.mini.white { background: radial-gradient(circle at 34% 30%, #FFF 0, #C6C6C6 90%); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; min-height: 1.5em; }
.note { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--lv2); }
.note.warn { color: var(--bad); font-weight: 600; }
.note.ok { color: var(--good); }
h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg + h2 { margin-top: 14px; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg button {
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 10px;
  padding: 9px 4px;
  font-size: 15px;
  cursor: pointer;
  white-space: nowrap;
}
.seg button:hover:not(:disabled) { border-color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.seg button.lv0[aria-pressed="true"] { background: var(--lv0); border-color: var(--lv0); color: #FFF; }
.seg button.lv1[aria-pressed="true"] { background: var(--lv1); border-color: var(--lv1); color: #FFF; }
.seg button.lv2[aria-pressed="true"] { background: var(--lv2); border-color: var(--lv2); color: #FFF; }
.seg button.lv3[aria-pressed="true"] { background: var(--lv3); border-color: var(--lv3); color: #FFF; }
button:disabled { opacity: .4; cursor: not-allowed; }

/* 誰比較有利 */
.wr { margin-top: 10px; }
.wr-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--cpu); }
.wr-bar span { display: block; height: 100%; background: var(--me); transition: width .4s; }
.wr-text { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  padding: 10px 8px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn small { display: block; font-size: 12px; font-weight: 400; }
.btn.danger { background: var(--danger); border: 2px solid var(--danger); color: #FFF; }
.btn.danger:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); }
.btn.orange { background: var(--orange); border: 2px solid var(--orange); color: #FFF; }
.btn.orange:hover:not(:disabled) { background: var(--orange-hover); border-color: var(--orange-hover); }
.btn.brass { background: var(--brass); border: 2px solid var(--brass); color: #FFF; }
.btn.brass:hover:not(:disabled) { background: var(--brass-hover); border-color: var(--brass-hover); }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink); background: rgba(127, 140, 160, .18); }
.btn.ghost small { color: var(--muted); }
.btn small.on-color { color: rgba(255, 255, 255, .85); }

/* 覆盤 */
.games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
.game-item {
  width: 100%;
  text-align: left;
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
}
.game-item:hover { border-color: var(--ink); }
.game-item b { display: block; font-size: 15px; }
.game-item span { font-size: 13px; color: var(--muted); }
.rv-step { margin: 0; font-size: 18px; font-weight: 700; }
.rv-text { margin: 6px 0 0; font-size: 15px; line-height: 1.6; min-height: 3.2em; }
.grade { font-weight: 700; }
.g-good { color: var(--good); }
.g-q { color: var(--q); }
.g-m { color: var(--miss); }
.g-b { color: var(--bad); }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.nav button { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 0; font-size: 16px; cursor: pointer; }
.nav button:hover:not(:disabled) { border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip {
  min-width: 34px;
  padding: 3px 6px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.chip.g-good { border-color: var(--good); }
.chip.g-q { border-color: var(--q); }
.chip.g-m { border-color: var(--miss); }
.chip.g-b { border-color: var(--bad); }
.chip[aria-current="true"] { background: var(--ink); color: var(--card); }
.hint { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }

/* 狀態欄右上角的難度標籤 */
/* 狀態欄（照黑白棋的樣子） */
.st-card { border: 1px solid rgba(200, 164, 77, .55); padding: 14px 16px 12px; }
.st-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.st-top .status { min-width: 0; font-size: 18px; white-space: nowrap; }
.st-name { padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--line); color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
.st-name:empty { display: none; }
.st-btns { display: flex; gap: 6px; flex: none; }
.sbtn { padding: 6px 9px; border-radius: 2px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.sbtn.ghost { background: #253650; border: 1px solid #34486A; color: var(--ink); }
.sbtn.ghost:hover:not(:disabled) { background: #314767; }
.sbtn.orange { background: var(--orange); border: 1px solid var(--orange); color: #FFF; }
.sbtn.orange:hover:not(:disabled) { background: var(--orange-hover); border-color: var(--orange-hover); }
.st-mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.st-free { margin: 0; text-align: right; font-size: 14px; color: var(--muted); }
.st-count { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 16px; white-space: nowrap; }
.st-count b { margin: 0 2px; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.snd { flex: none; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.snd:hover { border-color: var(--ink); color: var(--ink); }
.st-cpu { margin-left: auto; color: var(--muted); font-size: 14px; }
.st-cpu b { font-size: 15px; font-weight: 700; margin: 0; }
.lvtxt.lv0 { color: #5CC18A; }
.lvtxt.lv1 { color: #7DB1EE; }
.lvtxt.lv2 { color: #EE9A50; }
.lvtxt.lv3 { color: #EE6A5F; }
.helpers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.helpers button { padding: 7px 4px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 14px; cursor: pointer; white-space: nowrap; }
.helpers button:hover { border-color: var(--ink); }
.helpers button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.actions.small .btn { padding: 8px; font-size: 15px; }

/* 開局頁面 */
#startMask { position: fixed; inset: 0; z-index: 30; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px; background: var(--bg); }
.start { width: min(440px, 100%); padding: 18px 22px 16px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.start-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.start-head h2 { grid-column: 2; margin: 0; font-family: "Songti TC", "STSong", serif; font-size: 34px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.start-head .link { justify-self: end; font-size: 20px; font-weight: 700; }
.start-sec { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.start-sec h3 { margin: 0 0 10px; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: .15em; color: var(--accent); }
.start input {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 3px double var(--accent);
  border-radius: 4px;
  background: var(--bg);
  text-align: center;
  font-size: 22px;
  letter-spacing: .08em;
}
.start input:focus { outline: none; border-color: var(--focus); }
.start input[readonly] { border-style: solid; border-width: 1px; border-color: var(--line); color: var(--muted); }
.start .hint, .start .err { text-align: center; }
.start .err { margin: 6px 0 0; font-size: 14px; color: var(--bad); }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick.four { grid-template-columns: repeat(4, 1fr); }
.pick button {
  padding: 12px 4px;
  border: 2px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  letter-spacing: .1em;
  cursor: pointer;
  white-space: nowrap;
}
.pick button:hover { border-color: var(--ink); color: var(--ink); }
.pick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.start-go {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 4px;
  background: var(--accent);
  color: #FFF;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .2em;
  cursor: pointer;
}
.start-go:hover { filter: brightness(.88); }
.link { padding: 0; border: none; background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; white-space: nowrap; }
.link:disabled { opacity: .4; cursor: not-allowed; }
.start-help { display: block; margin: 16px auto 0; font-size: 17px; font-weight: 600; }
.start-foot { display: flex; align-items: center; gap: 18px; margin-top: 18px; font-size: 15px; }
.start-foot .ver { margin-left: auto; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; }
.info-list { margin: 0; padding-left: 1.3em; font-size: 16px; line-height: 1.7; }
.info-list li + li { margin-top: 6px; }
/* 結果畫面：遊戲結束時跳出來 */
#endMask { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .45); }
.end { width: min(400px, 100%); padding: 22px 24px; border: 1px solid var(--accent); border-radius: 6px; background: var(--card); box-shadow: 0 10px 34px rgba(0, 0, 0, .5); }
.end h2 { margin: 0; text-align: center; font-family: "Songti TC", "STSong", serif; font-size: 34px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.end-score { margin: 14px 0 0; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.end-sub { margin: 6px 0 0; text-align: center; font-size: 17px; color: var(--muted); }
.end-rec { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; font-size: 20px; font-weight: 700; color: var(--accent); }
.end-rec.off { font-size: 16px; font-weight: 400; color: var(--muted); }
.end-rec .btn { padding: 6px 14px; font-size: 17px; border-radius: 2px; }
.end-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.end-actions .btn { padding: 16px 8px; font-size: 20px; border-radius: 2px; }
.end-actions .start-go { margin: 0; padding: 16px 8px; font-size: 20px; letter-spacing: .1em; border-radius: 2px; }

#infoMask { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .45); }

/* 確認視窗：跳在按下的按鈕旁邊 */
#popMask { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .18); }
.pop {
  position: fixed;
  width: max-content;
  max-width: min(320px, calc(100vw - 32px));
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
}
.pop p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; }
.pop input {
  display: block;
  width: 100%;
  margin: 0 0 8px;
  padding: 8px 10px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  font-size: 16px;
}
.pop input:focus { outline: none; border-color: var(--focus); }
.pop .err { margin: 0 0 8px; font-size: 14px; color: var(--bad); }
.pop .row { display: flex; gap: 8px; justify-content: flex-end; }
.pop .btn { padding: 8px 14px; font-size: 15px; }

/* 排行榜 */
.sheet {
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow: auto;
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 10px 34px rgba(0, 0, 0, .4);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 22px; color: var(--accent); font-family: "Songti TC", "STSong", serif; }
/* 雙週排名：放在遊戲畫面裡 */
.rank-title { margin: 0 0 8px; font-family: "Songti TC", "STSong", serif; font-size: 26px; font-weight: 700; letter-spacing: .12em; color: var(--accent); }
.rank-tabs { display: flex; align-items: flex-end; gap: 22px; border-bottom: 1px solid var(--line); }
.rank-tabs button { padding: 0 0 8px; border: none; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); font-size: 17px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.rank-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rank-period { margin-left: auto; padding-bottom: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.rank-list { list-style: none; margin: 0; padding: 0; max-height: 440px; overflow-y: auto; }
.rank-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto 44px 44px; gap: 8px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
.rank-list li.mine { background: rgba(200, 164, 77, .14); }
.rank-list .no { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank-list .lv { font-weight: 700; white-space: nowrap; }
.rank-list .lv.lv0 { color: #5CC18A; }
.rank-list .lv.lv1 { color: #7DB1EE; }
.rank-list .lv.lv2 { color: #EE9A50; }
.rank-list .lv.lv3 { color: #EE6A5F; }
.rank-list .side { color: var(--muted); }
.rank-list .what { text-align: right; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank-list .when { text-align: right; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank-empty { display: block !important; padding: 28px 0 !important; text-align: center; color: var(--muted); font-size: 16px !important; }
.rank-foot { display: flex; gap: 24px; margin-top: 12px; font-size: 16px; }
.rank-time { margin: 10px 0 0; font-size: 15px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .stone.drop, .cell.m-hint .mark { animation: none; }
  .wr-bar span { transition: none; }
}
@media (max-width: 800px) {
  .end h2 { font-size: 28px; }

<script>
"use strict";

// ===== 規則與電腦：整包放在 ENGINE() 裡，主畫面與背景執行緒共用同一份程式碼 =====
function ENGINE() {
  "use strict";
  const N = 15, NN = N * N, BLACK = 1, WHITE = 2, CENTER = 7 * N + 7;
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  const WIN = 1000000, INF = 2000000;
  const now = () => Date.now();
  function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
  function moveColor(i) { return i % 2 === 0 ? BLACK : WHITE; }

  // p 這顆子連成五子以上時，回傳那一整條的位置；沒有就回傳 null
  function fiveLine(b, p) {
    const v = b[p];
    if (!v) return null;
    const r0 = Math.floor(p / N), c0 = p % N;
    for (const [dr, dc] of DIRS) {
      const line = [p];
      for (let r = r0 + dr, c = c0 + dc; inside(r, c) && b[r * N + c] === v; r += dr, c += dc) line.push(r * N + c);
      for (let r = r0 - dr, c = c0 - dc; inside(r, c) && b[r * N + c] === v; r -= dr, c -= dc) line.unshift(r * N + c);
      if (line.length >= 5) return line;
    }
    return null;
  }

  function makesFive(b, p, v) {
    b[p] = v;
    const yes = fiveLine(b, p) !== null;
    b[p] = 0;
    return yes;
  }

  function boardOf(moves) {
    const b = new Int8Array(NN);
    moves.forEach((p, i) => { b[p] = moveColor(i); });
    return b;
  }

  // 從空盤照棋譜重下一遍：有不合法的一手就回傳 null
  function replay(moves) {
    const b = new Int8Array(NN);
    let over = null;
    for (let i = 0; i < moves.length; i++) {
      const p = moves[i];
      if (over || !Number.isInteger(p) || p < 0 || p >= NN || b[p]) return null;
      b[p] = moveColor(i);
      const line = fiveLine(b, p);
      if (line) over = { winner: b[p], line };
      else if (i === NN - 1) over = { draw: true };
    }
    return { board: b, over };
  }

  // ---- 弱、中：看每個空格的進攻與防守分數 ----
  // 候選點：離現有棋子 2 格以內的空格；空盤只有天元
  function candidates(b) {
    const out = [];
    let stones = 0;
    for (let p = 0; p < NN; p++) {
      if (b[p]) { stones++; continue; }
      const r = Math.floor(p / N), c = p % N;
      let near = false;
      for (let dr = -2; dr <= 2 && !near; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const rr = r + dr, cc = c + dc;
          if (inside(rr, cc) && b[rr * N + cc]) { near = true; break; }
        }
      }
      if (near) out.push(p);
    }
    if (stones === 0) out.push(CENTER);
    return out;
  }

  // 五格一組評分：p 所在的每一組連續五格，只有自己的子越多越好（進攻），只有對方的子越多越該擋（防守）
  const MINE = [7, 35, 800, 15000, 800000];
  const THEIRS = [7, 15, 400, 1800, 100000];
  function pointScore(b, p, me) {
    const op = 3 - me;
    const r0 = Math.floor(p / N), c0 = p % N;
    let s = 0;
    for (const [dr, dc] of DIRS) {
      for (let k = -4; k <= 0; k++) {
        let m = 0, o = 0, ok = true;
        for (let t = 0; t < 5; t++) {
          const r = r0 + (k + t) * dr, c = c0 + (k + t) * dc;
          if (!inside(r, c)) { ok = false; break; }
          const v = b[r * N + c];
          if (v === me) m++;
          else if (v === op) o++;
        }
        if (!ok || (m && o)) continue;
        s += o ? THEIRS[o] : MINE[m];
      }
    }
    return s;
  }

  // level：0 弱、1 中
  function aiMove(b, me, level, rnd = Math.random) {
    const cands = candidates(b);
    if (!cands.length) return -1;
    if (cands.length === 1 && cands[0] === CENTER && !b[CENTER]) {
      let empty = true;
      for (let p = 0; p < NN; p++) if (b[p]) { empty = false; break; }
      if (empty) return CENTER;
    }
    const best = list => list.reduce((a, p) => (a < 0 || pointScore(b, p, me) > pointScore(b, a, me) ? p : a), -1);
    const wins = cands.filter(p => makesFive(b, p, me));
    if (wins.length) return wins[0];
    const blocks = cands.filter(p => makesFive(b, p, 3 - me));
    if (blocks.length && (level >= 1 || rnd() < 0.75)) return best(blocks);
    const scored = cands.map(p => ({ p, s: pointScore(b, p, me) })).sort((x, y) => y.s - x.s);
    if (level === 0) {
      // 弱：從前 6 名裡挑，越前面越常挑到，常常沒注意到對方的三連
      const top = scored.slice(0, 6);
      return top[Math.floor(rnd() * rnd() * top.length)].p;
    }
    // 中：分數跟最高分差不多的點裡隨便挑一個，每局才不會一樣
    const near = scored.filter(x => x.s >= scored[0].s * 0.95);
    return near[Math.floor(rnd() * near.length)].p;
  }

  // ---- 強、最強：搜尋 ----
  // 棋盤上所有「連續五格」的組，每格記得自己屬於哪些組
  const WC = [], CW = Array.from({ length: NN }, () => []);
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      for (const [dr, dc] of DIRS) {
        if (!inside(r + 4 * dr, c + 4 * dc)) continue;
        const id = WC.length, cells = [];
        for (let t = 0; t < 5; t++) {
          const p = (r + t * dr) * N + c + t * dc;
          cells.push(p);
          CW[p].push(id);
        }
        WC.push(cells);
      }
    }
  }
  const NW = WC.length;
  const NEAR = Array.from({ length: NN }, (_, p) => {
    const r = Math.floor(p / N), c = p % N, list = [];
    for (let dr = -2; dr <= 2; dr++) {
      for (let dc = -2; dc <= 2; dc++) if ((dr || dc) && inside(r + dr, c + dc)) list.push((r + dr) * N + c + dc);
    }
    return list;
  });

  // Zobrist：不能用 xorshift（線性，會撞號），用 murmur3 的 fmix32 打散計數器
  function fmix32(h) {
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h | 0;
  }
  const Z1 = new Int32Array(3 * NN), Z2 = new Int32Array(3 * NN);
  for (let i = 0; i < 3 * NN; i++) { Z1[i] = fmix32(2 * i + 1); Z2[i] = fmix32(2 * i + 0x9E3779B9); }

  // 一組五格裡只有同一色的子：子越多分數越高
  const V = [0, 2, 12, 80, 600, 600];

  class Pos {
    constructor(b) {
      this.b = new Int8Array(NN);
      this.cnt = [null, new Uint8Array(NW), new Uint8Array(NW)];
      this.sum = [0, 0, 0];    // 各色的盤面分數
      this.four = [0, 0, 0];   // 各色「四子加一空」的組數：大於 0 就是下一手能連五
      this.near = new Uint8Array(NN);
      this.mark = new Int32Array(NN);
      this.stamp = 0;
      this.h1 = 0; this.h2 = 0; this.n = 0;
      if (b) for (let p = 0; p < NN; p++) if (b[p]) this.put(p, b[p]);
    }
    put(p, c) {
      const o = 3 - c, cc = this.cnt[c], co = this.cnt[o], ws = CW[p];
      for (let i = 0; i < ws.length; i++) {
        const w = ws[i], a = cc[w], z = co[w];
        if (z === 0) {
          this.sum[c] += V[a + 1] - V[a];
          if (a === 3) this.four[c]++;
          else if (a === 4) this.four[c]--;
        } else if (a === 0) {
          this.sum[o] -= V[z];
          if (z === 4) this.four[o]--;
        }
        cc[w] = a + 1;
      }
      this.b[p] = c;
      this.h1 ^= Z1[c * NN + p];
      this.h2 ^= Z2[c * NN + p];
      this.n++;
      const ns = NEAR[p];
      for (let i = 0; i < ns.length; i++) this.near[ns[i]]++;
    }
    take(p) {
      const c = this.b[p], o = 3 - c, cc = this.cnt[c], co = this.cnt[o], ws = CW[p];
      for (let i = 0; i < ws.length; i++) {
        const w = ws[i], a = cc[w] - 1, z = co[w];
        cc[w] = a;
        if (z === 0) {
          this.sum[c] -= V[a + 1] - V[a];
          if (a === 3) this.four[c]--;
          else if (a === 4) this.four[c]++;
        } else if (a === 0) {
          this.sum[o] += V[z];
          if (z === 4) this.four[o]++;
        }
      }
      this.b[p] = 0;
      this.h1 ^= Z1[c * NN + p];
      this.h2 ^= Z2[c * NN + p];
      this.n--;
      const ns = NEAR[p];
      for (let i = 0; i < ns.length; i++) this.near[ns[i]]--;
    }
    // c 色有 k 子、沒有對方子的組，裡面的空格（不重複）
    empties(c, k) {
      const out = [], cc = this.cnt[c], co = this.cnt[3 - c], st = ++this.stamp;
      for (let w = 0; w < NW; w++) {
        if (cc[w] !== k || co[w] !== 0) continue;
        for (const p of WC[w]) if (!this.b[p] && this.mark[p] !== st) { this.mark[p] = st; out.push(p); }
      }
      return out;
    }
    // c 色下一手就能連五的位置
    fivePoints(c) { return this.four[c] ? this.empties(c, 4) : []; }
    // c 色下了就變成「活四」（兩個連五點）的位置，也就是活三的關鍵點
    openFourPoints(c) {
      const res = [], cc = this.cnt[c], co = this.cnt[3 - c];
      for (const e of this.empties(c, 3)) {
        let first = -1, two = false;
        for (const w of CW[e]) {
          if (cc[w] !== 3 || co[w] !== 0) continue;
          for (const p of WC[w]) {
            if (this.b[p] || p === e) continue;
            if (first < 0) first = p;
            else if (p !== first) two = true;
          }
          if (two) break;
        }
        if (two) res.push(e);
      }
      return res;
    }
    moveScore(p, c) {
      const o = 3 - c, cc = this.cnt[c], co = this.cnt[o], ws = CW[p];
      let s = 0;
      for (let i = 0; i < ws.length; i++) {
        const a = cc[ws[i]], z = co[ws[i]];
        if (z === 0) s += MINE[a];
        else if (a === 0) s += THEIRS[z];
      }
      return s;
    }
    // 候選點依分數排好，取前 K 個；first 排第一
    ordered(c, K, first = -1, jitter = 0, rnd = Math.random) {
      const ps = [], ss = [];
      for (let p = 0; p < NN; p++) {
        if (this.b[p] || !this.near[p]) continue;
        ps.push(p);
        ss.push(this.moveScore(p, c) * (jitter ? 1 + jitter * rnd() : 1));
      }
      if (!ps.length) return this.n ? [] : [CENTER];
      const idx = ps.map((_, i) => i).sort((x, y) => ss[y] - ss[x]);
      const out = [];
      if (first >= 0 && !this.b[first]) out.push(first);
      for (const i of idx) {
        if (out.length >= K) break;
        if (ps[i] !== first) out.push(ps[i]);
      }
      return out;
    }
  }

  let deadline = 0, aborted = false, nodes = 0;
  function tick() {
    if ((++nodes & 1023) === 0 && now() > deadline) aborted = true;
    return aborted;
  }

  // 置換表：記住算過的盤面與最佳步
  const TBITS = 19, TMASK = (1 << TBITS) - 1, EXACT = 1, LOWER = 2, UPPER = 3;
  const TK = new Int32Array(1 << TBITS), TS = new Int32Array(1 << TBITS);
  const TD = new Int8Array(1 << TBITS), TF = new Int8Array(1 << TBITS), TM = new Int16Array(1 << TBITS);

  const o = a.createOscillator(), og = a.createGain();
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(110, t + 0.08);
  og.gain.setValueAtTime(0.35, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(og).connect(comp);
  o.start(t);
  o.stop(t + 0.11);
}
function tune(freqs, step) {
  const a = audio();
  if (!a) return;
  freqs.forEach((f, i) => {
    const t = a.currentTime + i * step;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + step * 1.8);
    o.connect(g).connect(comp);
    o.start(t);
    o.stop(t + step * 2);
  });
}

// ---- 棋盤 ----
function buildBoard() {
  let svg = "";
  for (let i = 0; i < N; i++) {
    const x = i + 0.5, edge = i === 0 || i === N - 1 ? ' class="edge"' : "";
    svg += `<line${edge} x1="${x}" y1="0.5" x2="${x}" y2="14.5"/><line${edge} x1="0.5" y1="${x}" x2="14.5" y2="${x}"/>`;
  }
  for (const [r, c] of [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]]) svg += `<circle cx="${c + 0.5}" cy="${r + 0.5}" r="0.11"/>`;
  $("grid").innerHTML = svg;
  for (let p = 0; p < NN; p++) {
    const el = document.createElement("div");
    el.className = "cell";
    el.dataset.i = String(p);
    el.setAttribute("role", "gridcell");
    el.tabIndex = p === focusIdx ? 0 : -1;
    const mk = document.createElement("span");
    mk.className = "mark";
    el.appendChild(mk);
    cellsEl.appendChild(el);
    cells.push(el);
    marks.push(mk);
  }
  cellsEl.addEventListener("pointerdown", e => { lastPointer = e.pointerType || "mouse"; });
  cellsEl.addEventListener("click", e => {
    const el = e.target && e.target.closest ? e.target.closest(".cell") : null;
    if (!el) return;
    const p = Number(el.dataset.i);
    moveFocus(p, false);
    onCell(p, lastPointer);
  });
  cellsEl.addEventListener("keydown", e => {
    const r = Math.floor(focusIdx / N), c = focusIdx % N;
    const step = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (step) {
      e.preventDefault();
      const rr = Math.min(N - 1, Math.max(0, r + step[0])), cc = Math.min(N - 1, Math.max(0, c + step[1]));
      moveFocus(rr * N + cc, true);
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      onCell(focusIdx, "keyboard");
    }
  });
}

function moveFocus(p, focus) {
  cells[focusIdx].tabIndex = -1;
  focusIdx = p;
  cells[p].tabIndex = 0;
  if (focus) cells[p].focus({ preventScroll: true });
}

// view：{ board, last, win, marks, myturn, me }
function drawBoard(v, animate) {
  for (let p = 0; p < NN; p++) {
    const s = v.board[p], cell = cells[p];
    let st = stones.get(p);
    if (s) {
      if (!st || st.dataset.c !== String(s)) {
        if (st) st.remove();
        st = document.createElement("div");
        st.className = "stone " + (s === BLACK ? "black" : "white") + (animate ? " drop" : "");
        st.dataset.c = String(s);
        cell.appendChild(st);
        stones.set(p, st);
      }
    } else if (st) {
      st.remove();
      stones.delete(p);
    }
    cell.classList.toggle("has", !!s);
    cell.classList.toggle("last", p === v.last);
    cell.classList.toggle("win", v.win.has(p));
    cell.classList.toggle("pending", v.myturn && p === pending);
    const mk = v.marks.get(p) || "";
    for (const m of MARKS) cell.classList.toggle(m, m === mk);
    cell.setAttribute("aria-label", `第 ${Math.floor(p / N) + 1} 行第 ${p % N + 1} 列，${s ? NAMES[s] : "空的"}${mk === "m-hint" ? "，建議下這裡" : mk === "m-d5" || mk === "m-d3" ? "，要小心" : mk === "m-best" ? "，比較好的位置" : ""}`);
  }
  boardEl.classList.toggle("myturn", v.myturn);
  boardEl.dataset.me = String(v.me);
}

// ---- 下棋 ----
function cancelAI() {
  aiBrain.cancel();
  if (aiTimer) clearTimeout(aiTimer);
  aiTimer = 0;
  thinking = false;
}

function freshGame(color, level, moves = [], extra = {}) {
  const r = E.replay(moves);
  return Object.assign({ id: randHex(16), color, level, board: r.board, moves: moves.slice(), over: null, undoUsed: 0, hintUsed: 0,
    ranked: true, replay: false, recorded: false, evals: [], hint: -1 }, extra);
}

function newGame() {
  hideEnd();
  cancelAI();
  anaBrain.cancel();
  pending = -1;
  G = freshGame(S.color, S.level);
  save();
  render();
  afterMove();
}

function afterMove() {
  if (!G.over) {
    maybeAI();
    analyzeLive();
  }
}

function place(p) {
  const v = turn();
  G.board[p] = v;
  G.moves.push(p);
  G.hint = -1;
  pending = -1;
  const line = E.fiveLine(G.board, p);
  if (line) G.over = { winner: v, line };
  else if (G.moves.length === NN) G.over = { draw: true };
  clack();
  if (G.over) finish();
  save();
  render();
  afterMove();
}

function finish() {
  anaBrain.cancel();
  const res = resultOf(G);
  if (res === "win") tune([523, 659, 784, 1047], 0.13);
  else if (res === "draw") tune([523, 659, 523], 0.16);
  else tune([392, 330], 0.22);
  archive();
  queueRecord();
  showEnd();
}

function maybeAI() {
  if (!G || G.over || turn() === G.color || thinking) return;
  thinking = true;
  render();
  const id = G.id, n = G.moves.length, t0 = Date.now();
  aiBrain.ask({ moves: G.moves.slice(), level: G.level, time: CFG.aiTime[G.level] }).then(res => {
    if (!G || G.id !== id || G.moves.length !== n || !thinking) return;
    const wait = Math.max(0, CFG.aiDelay - (Date.now() - t0));
    aiTimer = setTimeout(() => {
      aiTimer = 0;
      if (!G || G.id !== id || G.moves.length !== n || !thinking) return;
      thinking = false;
      let p = res && res.move;
      if (!Number.isInteger(p) || p < 0 || p >= NN || G.board[p]) p = E.aiMove(G.board, 3 - G.color, 1);
      place(p);
    }, wait);
  });
}

// 每個盤面都在背景算勝率與最佳的一手：「誰比較有利」「建議一手」「覆盤」共用同一份結果
let anaWaiters = [];
function analyzeLive() {
  if (!G || G.over || R) return;
  const k = G.moves.length;
  if (G.evals[k]) return;
  const id = G.id;
  anaBrain.ask({ moves: G.moves.slice(), level: 3, time: CFG.anaTime }).then(res => {
    if (!res || !G || G.id !== id || G.moves.length !== k) return;
    G.evals[k] = [res.move, Math.round(res.wr * 1000) / 1000];
    save();
    const waiters = anaWaiters;
    anaWaiters = [];
    waiters.forEach(f => f());
    render(false);
  });
}
function evalNow() {
  const k = G.moves.length;
  if (G.evals[k]) return Promise.resolve(G.evals[k]);
  return new Promise(resolve => {
    anaWaiters.push(() => resolve(G.evals[k] || null));
    if (!anaBrain.job) analyzeLive();
  });
}

// 手機上點一下先選位置，再點同一格才放下，避免點錯
function onCell(p, pointerType) {
  if (R || startOpen || !myTurn() || G.board[p]) return;
  if (pointerType === "touch" && pending !== p) {
    pending = p;
    render();
    return;
  }
  pending = -1;
  place(p);
}

// 反悔每局只能用一次，用了不影響排名
function canUndo() {
  return !!G && !R && G.undoUsed < MAX_UNDO && playerMoves() > 0 && !(G.over && (G.over.resign || G.over.winner === G.color || G.recorded));
}

function undo() {
  if (!canUndo()) return;
  hideEnd();
  cancelAI();
  // 退到自己上一手之前：電腦的那手和自己的那手一起退
  while (G.moves.length) {
    const i = G.moves.length - 1, p = G.moves.pop();
    G.board[p] = 0;
    if (moveColor(i) === G.color) break;
  }
  G.over = null;
  G.undoUsed++;
  G.hint = -1;
  pending = -1;
  save();
  render();
  afterMove();
}

async function hint() {
  if (!myTurn() || G.hint >= 0) return;
  if (G.ranked && !G.replay && G.hintUsed >= FREE_HINT) {
    const ok = await confirmNear($("hintBtn"), "免費的建議用完了。再用，這局就不能上排名。", "照樣使用");
    if (!ok || !myTurn()) return;
    G.ranked = false;
  }
  G.hintUsed++;
  const k = G.moves.length, id = G.id;
  $("hintBtn").disabled = true;
  $("sub").textContent = "電腦正在幫你想⋯";
  $("sub").hidden = false;
  const ev = await evalNow();
  if (!G || G.id !== id || G.moves.length !== k || !ev) { render(false); return; }
  G.hint = ev[0];
  save();
  render(false);
}

async function resign() {
  if (!inProgress()) return;
  const ok = await confirmNear($("resignBtn"), "要認輸嗎？認輸後會打開覆盤，看看哪裡可以下得更好。", "認輸");
  if (!ok || !inProgress()) return;
  cancelAI();
  G.over = { winner: 3 - G.color, resign: true };
  G.hint = -1;
  finish();
  save();
  openReview(GAMES.find(e => e.id === G.id) || null);
}

// ===== 下過的棋與覆盤 =====
function archive() {
  const e = { id: G.id, t: Date.now(), color: G.color, level: G.level, moves: G.moves.slice(), result: resultOf(G),
    ranked: G.ranked, replay: G.replay, kept: false, evals: G.evals.slice() };
  const old = GAMES.findIndex(x => x.id === G.id);
  if (old >= 0) { e.kept = GAMES[old].kept; GAMES.splice(old, 1); }
  GAMES.unshift(e);
  let free = 0;
  GAMES = GAMES.filter(g => g.kept || ++free <= KEEP_GAMES).slice(0, MAX_GAMES);

function fmtTime(t) {
  const d = new Date(t), pad = x => String(x).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function gameTitle(e) { return `你拿${NAMES[e.color]}・電腦${LEVEL_NAMES[e.level]}・${RESULT_TEXT[e.result]}`; }

// 玩家第 i 手（棋譜索引）的評語
function gradeOf(e, i) {
  const before = playerWr(e.evals, e.color, i);
  let after;
  if (i + 1 === e.moves.length && e.result !== "resign") after = e.result === "win" ? 1 : e.result === "draw" ? 0.5 : 0;
  else after = playerWr(e.evals, e.color, i + 1);
  if (before === null || after === null) return null;
  const best = e.evals[i][0], loss = before - after, move = e.moves[i];
  const g = loss >= 0.3 ? "b" : loss >= 0.15 ? "m" : loss >= 0.05 ? "q" : move === best ? "good" : "ok";
  return { g, loss, best, move };
}
const GRADE_TEXT = { good: "好棋", ok: "不錯", q: "疑問手", m: "失誤", b: "惡手" };

function explain(e, i, gr) {
  if (gr.g === "good") return "好棋！這就是最好的位置。";
  if (gr.g === "ok") return "這手不錯。";
  const b = E.boardOf(e.moves.slice(0, i)), me = e.color, cpu = 3 - me;
  const mine = E.threats(b, me), theirs = E.threats(b, cpu);
  if (mine.five.length && !mine.five.includes(gr.move)) return "這裡可以直接連成五子贏棋！綠圈就是贏的位置。";
  if (theirs.five.length && !theirs.five.includes(gr.move)) return "電腦已經四顆連在一起，要先擋住綠圈的地方，不然電腦下一手就贏了。";
  if (theirs.three.length && !theirs.three.includes(gr.move) && !E.threats(E.boardOf(e.moves.slice(0, i + 1)), me).five.length) {
    return "電腦有三顆連成一排、兩頭都空著，要先擋住一頭。";
  }
  if (playerWr(e.evals, me, i) >= 0.95) return "這裡本來有一連串的攻擊可以贏，綠圈是開始的位置。";
  return "這手讓電腦變得比較有利，綠圈的地方會更好。";
}

function openReview(entry) {
  if (!GAMES.length) return;
  pending = -1;
  anaBrain.cancel();
  anaWaiters = [];
  R = { entry: entry || null, k: entry ? entry.moves.length : 0 };
  $("gamePanel").hidden = true;
  $("reviewPanel").hidden = false;
  render(false);
  if (entry) analyzeReview(entry);
}
function closeReview() {
  anaBrain.cancel();
  R = null;
  $("gamePanel").hidden = false;
  $("reviewPanel").hidden = true;
  render(false);
  if (needStart()) openStart();
  else analyzeLive();
}

function neededPositions(e) {
  const need = [];
  for (let i = 0; i < e.moves.length; i++) {
    if (moveColor(i) !== e.color) continue;
    if (!e.evals[i]) need.push(i);
    if ((i + 1 < e.moves.length || e.result === "resign") && !e.evals[i + 1] && !need.includes(i + 1)) need.push(i + 1);
  }
  return need;
}

async function analyzeReview(e) {
  const need = neededPositions(e);
  R.total = need.length;
  R.done = 0;
  renderReview(false);
  for (const k of need) {
    if (!R || R.entry !== e) return;
    const res = await anaBrain.ask({ moves: e.moves.slice(0, k), level: 3, time: CFG.reviewTime });
    if (!R || R.entry !== e) return;
    if (res) {
      e.evals[k] = [res.move, Math.round(res.wr * 1000) / 1000];
      saveGames();
    }
    R.done++;
    renderReview(false);
  }
}

function reviewView() {
  const e = R.entry, k = R.k;
  const board = E.boardOf(e.moves.slice(0, k));
  const last = k ? e.moves[k - 1] : -1;
  let win = new Set();
  if (k === e.moves.length && last >= 0) win = new Set(E.fiveLine(board, last) || []);
  const marksMap = new Map();
  if (k && moveColor(k - 1) === e.color) {
    const gr = gradeOf(e, k - 1);
    if (gr && gr.loss >= 0.05 && gr.best >= 0 && gr.best !== last) marksMap.set(gr.best, "m-best");
  }
  return { board, last, win, marks: marksMap, myturn: false, me: e.color };
}

function renderReview(animate) {
  const e = R.entry;
  $("rvListCard").hidden = !!e;
  $("rvGameCard").hidden = !e;
  $("rvRetry").hidden = !e;
  $("rvKeep").hidden = !e;
  $("rvList2").hidden = !e;
  if (!e) {
    drawBoard(Object.assign(gameView(), { myturn: false, marks: new Map() }), false);
    $("rvInfo").textContent = "選一盤棋來看看。";
    $("rvProgress").textContent = "";
    const list = $("rvList");
    list.replaceChildren(...GAMES.map(g => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "game-item";
      const t1 = document.createElement("b");
      t1.textContent = (g.kept ? "★ " : "") + gameTitle(g);
      const t2 = document.createElement("span");
      t2.textContent = `${fmtTime(g.t)}・你下了 ${countOf(g.moves, g.color)} 手${g.replay ? "・重下的棋" : ""}`;
      b.append(t1, t2);
      b.addEventListener("click", () => { R.entry = g; R.k = g.moves.length; render(false); analyzeReview(g); });
      li.appendChild(b);
      return li;
    }));
    return;
  }
  drawBoard(reviewView(), animate);
  $("rvInfo").textContent = `${fmtTime(e.t)}　${gameTitle(e)}`;
  // 分析進度與統計
  const grades = [];
  for (let i = 0; i < e.moves.length; i++) if (moveColor(i) === e.color) grades.push({ i, gr: gradeOf(e, i) });
  if (R.total && R.done < R.total) {
    $("rvProgress").textContent = `電腦正在看這盤棋⋯ ${R.done}／${R.total}`;
  } else {
    const c = { good: 0, q: 0, m: 0, b: 0 };
    grades.forEach(x => { if (x.gr && x.gr.g in c) c[x.gr.g]++; });
    $("rvProgress").textContent = `看完了：好棋 ${c.good}、疑問手 ${c.q}、失誤 ${c.m}、惡手 ${c.b}`;
  }
  // 這一手
  const k = R.k;
  let step, text = "", cls = "";
  if (k === 0) {
    step = "開始";
    text = "按 ▶ 一手一手往下看。";
  } else {
    const i = k - 1, who = moveColor(i) === e.color;
    step = `${who ? "你" : "電腦"}的第 ${countOf(e.moves, moveColor(i), k)} 手`;
    if (who) {
      const gr = gradeOf(e, i);
      if (!gr) text = "電腦還在看這一手⋯";
      else {
        cls = "g-" + gr.g.replace("ok", "good");
        text = (gr.g === "ok" ? "" : GRADE_TEXT[gr.g] + "：") + explain(e, i, gr);
      }
    } else {
      text = "電腦下在這裡。";
    }
    if (k === e.moves.length) text += `　（${RESULT_TEXT[e.result]}）`;
  }
  $("rvStep").textContent = step;
  $("rvText").textContent = text;
  $("rvText").className = "rv-text " + cls;
  $("rvFirst").disabled = $("rvPrev").disabled = k === 0;
  $("rvNext").disabled = $("rvLast").disabled = k === e.moves.length;
  $("rvRetry").disabled = !(k > 0 && moveColor(k - 1) === e.color);
  $("rvKeep").textContent = e.kept ? "★ 已保留" : "☆ 保留";
  $("rvKeep").setAttribute("aria-pressed", String(e.kept));
  $("rvChips").replaceChildren(...grades.map(({ i, gr }, j) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (gr ? " g-" + (gr.g === "ok" ? "none" : gr.g) : "");
    b.textContent = String(j + 1);
    b.title = gr ? GRADE_TEXT[gr.g] : "還在看";
    b.setAttribute("aria-label", `你的第 ${j + 1} 手${gr ? "，" + GRADE_TEXT[gr.g] : ""}`);
    b.setAttribute("aria-current", String(i === k - 1));
    b.addEventListener("click", () => { R.k = i + 1; render(false); });
    return b;
  }));
}

// ===== 共用排行榜 =====
// 名次：贏的排前面，比誰用的手數少；手數一樣、或都是和局，後來達成的排前面（後端有一份一模一樣的）
function byRank(a, b) {
  if (a.result !== b.result) return a.result === "win" ? -1 : 1;
  if (a.result === "win" && a.count !== b.count) return a.count - b.count;
  return b.t - a.t;
}

function queueRecord() {
  if (!G.ranked || G.replay || G.recorded) return;
  const res = resultOf(G);
  if (res !== "win" && res !== "draw") return;
  const code = randHex(32);
  RK.pending.push({ id: G.id, code, level: G.level, color: G.color, result: res, count: playerMoves(), moves: G.moves.slice(), t: Date.now() });
  RK.mine[G.id] = code;
  G.recorded = true;
  saveRank();
  trySend();
}

async function fetchJSON(url, opts = {}) {
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 12000) : 0;
  try {
    const r = await fetch(url, Object.assign({ redirect: "follow" }, opts, ctl ? { signal: ctl.signal } : {}));
    if (!r.ok) throw new Error("http " + r.status);
    return await r.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function okRow(x) {
  return x && typeof x === "object" && typeof x.id === "string" && typeof x.name === "string" && x.name.length <= 40 &&
    (x.result === "win" || x.result === "draw") && Number.isInteger(x.count) && Number.isFinite(x.t);
}
function takeBoards(res) {
  if (!res || typeof res.boards !== "object" || !res.boards) return;
  const boards = {};
  for (const tab of ["cur", "prev"]) {
    boards[tab] = {};
    const src = res.boards[tab] || {};
    for (let lv = 0; lv < 4; lv++) {
      for (const c of [BLACK, WHITE]) {
        const rows = Array.isArray(src[`${lv}-${c}`]) ? src[`${lv}-${c}`].filter(okRow).slice(0, 100) : [];
        boards[tab][`${lv}-${c}`] = rows.sort(byRank);
      }
    }
  }
  RK.boards = boards;
  if (Number.isFinite(res.updated)) RK.updated = res.updated;
  const p = res.period;
  if (p && typeof p === "object") {
    const okP = a => Array.isArray(a) && a.length === 2 && a.every(Number.isFinite);
    RK.period = { cur: okP(p.cur) ? p.cur : null, prev: okP(p.prev) ? p.prev : null };
  }
}

let sending = false;
async function trySend() {
  if (!SCRIPT_URL) { RK.net = "off"; refreshRankViews(); return; }
  if (sending) return;
  const recs = S.name ? RK.pending : [];
  sending = true;
  try {
    let res;
    if (recs.length || RK.renames.length) {
      const body = { records: recs.map(r => Object.assign({}, r, { name: S.name })), renames: RK.renames };
      res = await fetchJSON(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    } else {
      res = await fetchJSON(SCRIPT_URL + "?t=" + Date.now());
    }
    if (res && res.gomoku === 1) {
      const done = new Set([...(Array.isArray(res.accepted) ? res.accepted : []),
        ...(Array.isArray(res.rejected) ? res.rejected.map(x => x && x.id) : [])]);
      RK.pending = RK.pending.filter(r => !done.has(r.id));
      // 舊版後端沒有 renamed 欄位：改名留在待送清單，等後端更新
      if (Array.isArray(res.renamed)) {
        const ok = new Set(res.renamed);
        RK.renames = RK.renames.filter(x => !ok.has(x.id));
      }
      takeBoards(Object.assign({}, res, { updated: Date.now() }));
      RK.net = "ok";
    } else {
      RK.net = "old";
    }
  } catch (e) {
    RK.net = "fail";
  }
  sending = false;
  saveRank();
  refreshRankViews();
}

function refreshRankViews() {
  if (!R && G) renderStatus(dangerInfo());
  renderRank();
}

// 結果畫面的「改名字」：改這一局成績的名字，之後的成績也用新名字
async function renameThis() {
  if (!S.name || !G || !G.recorded) return;
  const name = await promptNear($("endName"), "新的名字（1 到 12 個字）：", "改好了", S.name);
  if (!name || name === S.name) return;
  S.name = name;
  save();
  // 這局已經送上排行榜：憑改名碼改；還沒送出的，送的時候就會用新名字
  if (!RK.pending.some(r => r.id === G.id) && RK.mine[G.id]) {
    RK.renames = RK.renames.filter(x => x.id !== G.id);
    RK.renames.push({ id: G.id, code: RK.mine[G.id], name });
    saveRank();
  }
  render(false);
  renderEnd();
  trySend();
}

// 排名清單：難度高的在前，同難度執白在前（比較難贏），再照 byRank（手數少、後達成的在前，和局最後）
const RV = { tab: "cur" };
function rankRows(tab) {
  const b = RK.boards && RK.boards[tab];
  if (!b) return [];
  const rows = [];
  for (let lv = 3; lv >= 0; lv--) {
    for (const c of [WHITE, BLACK]) for (const r of b[`${lv}-${c}`] || []) rows.push(Object.assign({ level: lv, color: c }, r));
  }
  return rows.sort((a, b2) => b2.level - a.level || b2.color - a.color || byRank(a, b2));
}
function setTab(tab, focus) {
  RV.tab = tab;
  renderRank();
  if (focus) $(tab === "cur" ? "tabCur" : "tabPrev").focus({ preventScroll: true });
}
function fmtDay(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; }

function renderRank() {
  for (const [id, tab] of [["tabCur", "cur"], ["tabPrev", "prev"]]) {
    $(id).setAttribute("aria-selected", String(RV.tab === tab));
    $(id).tabIndex = RV.tab === tab ? 0 : -1;
  }
  const per = RK.period && RK.period[RV.tab];
  $("rankPeriod").textContent = per ? `${fmtDay(per[0])}～${fmtDay(per[1] - 1)}` : "";
  const rows = rankRows(RV.tab);
  const list = $("rankList");
  if (!rows.length) {
    const li = document.createElement("li");
    li.className = "rank-empty";
    li.textContent = RK.boards ? "還沒有人上榜，快來當第一名！" : "還沒拿到排名。";
    list.replaceChildren(li);
  } else {
    list.replaceChildren(...rows.map((r, i) => {
      const li = document.createElement("li");
      if (r.id in RK.mine) li.className = "mine";
      const parts = [["no", String(i + 1)], ["nm", r.name], ["lv lv" + r.level, LEVEL_NAMES[r.level]],
        ["side", r.color === BLACK ? "●" : "○"], ["what", r.result === "win" ? `${r.count}手` : "和局"], ["when", fmtDay(r.t)]];
      li.append(...parts.map(([c, t]) => { const sp = document.createElement("span"); sp.className = c; sp.textContent = t; return sp; }));
      li.title = `${r.name}・${LEVEL_NAMES[r.level]}・${r.color === BLACK ? "執黑" : "執白"}・${r.result === "win" ? r.count + "手贏" : "和局"}・${fmtDay(r.t)}`;
      return li;
    }));
  }
  const d = RK.updated ? new Date(RK.updated) : null;
  $("rankTime").textContent = d ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} 更新` : "";
  const wait = RK.pending.length;
  let net = "";
  if (!SCRIPT_URL) net = "排行榜還沒開通，成績先存在這台裝置。";
  else if (RK.net === "fail") net = "現在連不上排行榜，等一下會再試。";
  else if (RK.net === "old") net = "排行榜的程式還沒更新，成績先存起來。";
  if (wait) net += `還有 ${wait} 筆成績等著送出${S.name ? "" : "（寫下名字才會送出）"}。`;
  $("rankNet").textContent = net;
  $("rankNet").hidden = !net;
}

// 匯出排名：下載成 CSV（用試算表打開時，名字開頭是 = + - @ 前面加 '，免得被當成公式）
function exportRank() {
  const rows = rankRows(RV.tab);
  const cell = v => {
    let t = String(v);
    if (/^[=+\-@]/.test(t)) t = "'" + t;
    return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const lines = [["名次", "名字", "難度", "執子", "成績", "日期"].join(",")].concat(rows.map((r, i) =>
    [i + 1, r.name, LEVEL_NAMES[r.level], r.color === BLACK ? "黑" : "白", r.result === "win" ? `${r.count}手` : "和局", fmtDay(r.t)].map(cell).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `五子棋${RV.tab === "cur" ? "本期" : "上期"}排名.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return lines;
}

// ---- 確認視窗與輸入名字：跳在按下的按鈕旁邊 ----
let popState = null;
function openPop(anchor, text, okText, input) {
  closePop(null);
  $("popText").textContent = text;
  $("popOk").textContent = okText;
  $("popInput").hidden = !input;
  $("popErr").hidden = true;
  if (input) $("popInput").value = input.value || "";
  $("popMask").hidden = false;
  return new Promise(resolve => {
    popState = { anchor, resolve, input: !!input };
    placePop();
    (input ? $("popInput") : $("popOk")).focus({ preventScroll: true });
  });
}
function confirmNear(anchor, text, okText) { return openPop(anchor, text, okText, null).then(v => v === true); }
function promptNear(anchor, text, okText, value) { return openPop(anchor, text, okText, { value }); }
function popOk() {
  if (!popState) return;
  if (popState.input) {
    const name = cleanName($("popInput").value);
    if (!name) { $("popErr").hidden = false; return; }
    closePop(name);
  } else {
    closePop(true);
  }
}
function placePop() {
  if (!popState) return;
  const pop = $("pop");
  const id = popState.anchor.id;
  const anchor = (id && $(id)) || popState.anchor;   // 按鈕重畫後可能已換成新元素
  const a = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let top = a.bottom + 8;
  if (top + h > innerHeight - 8) top = Math.max(8, a.top - 8 - h);
  const left = Math.min(Math.max(16, a.left + a.width / 2 - w / 2), Math.max(16, innerWidth - 16 - w));
  pop.style.top = top + "px";
  pop.style.left = left + "px";
}
function closePop(value) {
  if (!popState) return;
  const { anchor, resolve } = popState;
  popState = null;
  $("popMask").hidden = true;
  if (anchor && anchor.focus) anchor.focus({ preventScroll: true });
  resolve(value);
}

function init() {
  load();
  loadGames();
  loadRank();
  applySound();
  buildBoard();
  $("popOk").addEventListener("click", popOk);
  $("popCancel").addEventListener("click", () => closePop(null));
  $("popInput").addEventListener("keydown", e => { if (e.key === "Enter") popOk(); });
  $("popMask").addEventListener("click", e => { if (e.target === $("popMask")) closePop(null); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (popState) closePop(null);
      else if (!$("endMask").hidden) hideEnd();
      else if (!$("infoMask").hidden) closeInfo();
      return;
    }
    if (R && R.entry && !popState && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !(e.target && e.target.closest && e.target.closest(".cells"))) {
      e.preventDefault();
      reviewStep(R.k + (e.key === "ArrowRight" ? 1 : -1));
    }
  });
  addEventListener("resize", placePop);
  addEventListener("scroll", placePop, true);
  addEventListener("online", trySend);
  $("newBtn").addEventListener("click", restart);
  $("undoBtn").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", hint);
  $("resignBtn").addEventListener("click", resign);
  $("nameBtn").addEventListener("click", () => askName($("nameBtn")));
  $("endName").addEventListener("click", () => (S.name ? renameThis() : askName($("endName"))));
  $("endReview").addEventListener("click", () => { hideEnd(); openReview(GAMES.find(e => e.id === G.id) || null); });
  $("endAgain").addEventListener("click", () => { hideEnd(); restart(); });
  $("endMask").addEventListener("click", e => { if (e.target === $("endMask")) hideEnd(); });
  $("dangerBtn").addEventListener("click", () => toggleHelper("danger"));
  $("wrBtn").addEventListener("click", () => toggleHelper("wr"));
  $("soundBtn").addEventListener("click", () => {
    S.sound = !S.sound;
    applySound();
    save();
  });
  // 開局頁面
  for (const b of document.querySelectorAll("#colorSeg button")) b.addEventListener("click", () => pick("color", Number(b.dataset.color)));
  for (const b of document.querySelectorAll("#levelSeg button")) b.addEventListener("click", () => pick("level", Number(b.dataset.level)));
  $("startBtn").addEventListener("click", startGame);
  $("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
  $("startReview").addEventListener("click", () => { closeStart(); openReview(null); });
  $("helpBtn").addEventListener("click", () => openInfo("help", $("helpBtn")));
  $("tipsBtn").addEventListener("click", () => openInfo("tips", $("tipsBtn")));
  $("algoBtn").addEventListener("click", () => openInfo("algo", $("algoBtn")));
  $("infoClose").addEventListener("click", closeInfo);
  $("infoMask").addEventListener("click", e => { if (e.target === $("infoMask")) closeInfo(); });
  // 覆盤
  $("rvFirst").addEventListener("click", () => reviewStep(0));
  $("rvPrev").addEventListener("click", () => reviewStep(R.k - 1));
  $("rvNext").addEventListener("click", () => reviewStep(R.k + 1));
  $("rvLast").addEventListener("click", () => reviewStep(Infinity));
  $("rvRetry").addEventListener("click", retryFrom);
  $("rvKeep").addEventListener("click", toggleKeep);
  $("rvList2").addEventListener("click", () => { anaBrain.cancel(); R.entry = null; render(false); });
  $("rvBack").addEventListener("click", closeReview);
  // 排行榜
  $("rankRefresh").addEventListener("click", trySend);
  $("rankExport").addEventListener("click", exportRank);
  $("tabCur").addEventListener("click", () => setTab("cur"));
  $("tabPrev").addEventListener("click", () => setTab("prev"));
  $("rankTabs").addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); setTab(RV.tab === "cur" ? "prev" : "cur", true); }
  });

  renderRank();
  // 還沒開始下（或第一次玩）先到開局頁面；下到一半的棋接著下
  if (needStart()) {
    if (!G) G = freshGame(S.color, S.level);
    render(false);
    openStart();
  } else {
    render(false);
    afterMove();
    if (G.over) showEnd(0);
  }
  trySend();
}
init();
</script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
</body>
</html>
